aid: accruent
name: Accruent
description: >-
  Accruent is a workplace, facilities and asset management software company serving more than 10,000
  customers in over 150 countries, with a portfolio spanning CMMS/EAM (Maintenance Connection),
  engineering document management (Meridian), IWMS and lease accounting (Lucernex), space and event
  scheduling (EMS), telecom and wireless site management (Siterra), and IoT condition monitoring
  (Observe). Its public API surface is an Azure API Management developer network at
  developer.accruent.com plus per-product REST APIs; the Maintenance Connection Web API is the only
  contract published without a login — a Swagger 2.0 document describing 255 operations across
  assets, work orders, parts, purchasing, labor and lookup tables. Every other product API
  (Siterra, Meridian Cloud, EMS Platform Services, Lucernex) is documented publicly but its
  machine-readable definition sits behind developer-program approval or a customer tenancy.
image: https://www.accruent.com/hubfs/accruent-social-share.png
url: https://raw.githubusercontent.com/api-evangelist/accruent/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
