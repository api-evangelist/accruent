apis:
- name: Maintenance Connection Web API
  description: >-
    RESTful CMMS API for the Accruent Maintenance Connection product. 126 paths / 255 operations
    across assets, asset specifications, meter history, images and documents, classifications,
    companies, parts and inventory, labor, lookup tables, purchase orders, receipts and invoices,
    specifications and work orders (tasks, assignments, labor/misc/part estimates and actuals,
    status updates). HTTP Basic auth over a base64 "ConnectionKey:APIKey" token; OData-style
    $filter / $top / $skip / $orderby query options; 200 requests per minute per connection.
  humanURL: https://api.maintenanceconnection.com/v8/help/docs
  baseURL: https://api.maintenanceconnection.com/v8
  tags:
  - CMMS
  - Maintenance
  - Work Orders
  - Asset Management
  - Facilities Management
  tags_raw:
