apis:
- name: Siterra API
  description: >-
    REST API for Accruent Siterra, the wireless/telecom site and project lifecycle management product,
    fronted by the Accruent Developer Network on Azure API Management. Subscription-key auth via the accruent-subscription-key
    header or a subscription-key query parameter. Access requires an invitation into the Accruent Developer
    Program; the API definition is only exposed to signed-in, approved subscribers.
  humanURL: https://developer.accruent.com/wiki/siterra/gettingstarted
  baseURL: https://api.accruent.com/siterra/us/
  tags:
  - Telecom
  - Site Management
  - Project Management
  - Asset Management
  tags_raw:
  - telecom
  - site-management
  - project-management
  - asset-management
  properties:
  - type: DeveloperPortal
    url: https://developer.accruent.com/
  - type: GettingStarted
    url: https://developer.accruent.com/wiki/siterra/gettingstarted
  - type: Documentation
    url: https://developer.accruent.com/wiki/siterra/gettingstarted
- name: Meridian Cloud API
  description: >-
    REST APIs for Accruent Meridian Cloud engineering document management — asset APIs, relationship APIs
    and contractor package APIs used by PowerWeb, Meridian Portal, Meridian Explorer and Meridian Mobile.
    Served from a regional Azure API Management developer portal (api-developer.meridiancloud.net) with
    Ocp-Apim-Subscription-Key auth. Accruent does not publish the API base URL outside the portal — it
    is disclosed to approved subscribers per tenancy region — so no baseURL is recorded here rather than
    guessing one.
  humanURL: >-
    https://help.accruent.com/meridian/Content/Online_Help/Cloud_Portal/Integrations/MeridianCloudAPI.htm
  tags:
  - Engineering Document Management
  - Document-Management
  - Asset Management
  tags_raw:
  - engineering-document-management
  - document-management
  - asset-management
  properties:
  - type: DeveloperPortal
    url: https://api-developer.meridiancloud.net/
  - type: GettingStarted
    url: https://api-developer.meridiancloud.net/wiki/meridian/gettingstarted
  - type: Documentation
    url: >-
      https://help.accruent.com/meridian/Content/Online_Help/Cloud_Portal/Integrations/MeridianCloudAPI.htm
- name: EMS Platform Services
  description: >-
    RESTful API layer for Accruent EMS space and event scheduling, documented as a Platform as a Service
    surface with JWT authentication. The Swagger UI ships with the deployment rather than on a public
    host — self-hosted at {your-host}/EmsPlatform/swagger and, for cloud tenancies, at https://{yoursite}.emscloudservice.com/platform/api/v1/static/swagger-ui/
    — so the definition is only reachable from inside a customer tenancy. Supersedes the legacy EMS SOAP
    API Web Service, which Accruent states is no longer being developed.
  humanURL: >-
    https://help.accruent.com/ems/Content/EMSPlatformServices/InstallationGuide/Introduction.html
  baseURL: https://{yoursite}.emscloudservice.com/platform/api/v1
  tags:
  - Space Management
  - Scheduling
  - Facilities Management
  tags_raw:
  - space-management
  - scheduling
  - facilities-management
  properties:
  - type: Documentation
    url: >-
      https://help.accruent.com/ems/Content/EMSPlatformServices/InstallationGuide/Introduction.html
- name: Lucernex REST API
  description: >-
    RESTful API for Accruent Lucernex IWMS / lease accounting. Documented on the public customer help
    site, but the schema browser and console are served from the customer's own tenancy at {tenant-url}/en/test/RESTful.jsp,
    so there is no public machine-readable definition. Accruent documents that Lucernex uses XML in its
    API calls and that JSON is not fully supported.
  humanURL: >-
    https://help.accruent.com/lucernex/Content/Online%20Help/00_Advanced_Content/API_Documentation/1_IntroductionToAPI.htm
  baseURL: https://{tenant}.lucernex.com/
  tags:
  - IWMS
  - Lease Accounting
  - Real-Estate
  - Facilities Management
  tags_raw:
  - iwms
  - lease-accounting
  - real-estate
  - facilities-management
  properties:
