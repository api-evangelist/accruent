versioning:
  scheme: uri-path
  current: v8
  previous: [v7]
  docs: https://api.maintenanceconnection.com/v8/help/docs
  note: >-
    Maintenance Connection versions its Web API in the URI path and keeps two schema generations
    documented side by side. v7 has help pages but no machine-readable definition -
    /v7/swagger/ui/index and /v7/swagger/docs/* both 404 - so only v8 is consumable by a generator.
    Accruent publishes no statement of how long v7 remains supported.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    Accruent publishes no API deprecation policy, no sunset schedule and no RFC 8594 header support
    for any product. What it does publish are individual end-of-development announcements in the
    product docs - see deprecated_apis below - which tell a reader that a surface is finished but
    not when it will stop answering.
deprecated_apis:
