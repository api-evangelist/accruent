          type: string
        Description:
          type: string
        StatusDate:
          format: date-time
          type: string
        BuyerCompanyRef:
          $ref: '#/components/schemas/EntityRefViewModel_Company'
        BuyerRef:
          $ref: '#/components/schemas/EntityRefViewModel_Labor'
        FollowupDate:
          format: date-time
          type: string
        ShipDate:
          format: date-time
          type: string
        RepairCenterRef:
          $ref: '#/components/schemas/EntityRefViewModel_RepairCenter'
        DepartmentRef:
          $ref: '#/components/schemas/EntityRefViewModel_Department'
        CustomerRef:
          $ref: '#/components/schemas/EntityRefViewModel_Customer'
        PriorityDetails:
