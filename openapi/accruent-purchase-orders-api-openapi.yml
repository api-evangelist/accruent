      properties:
        Value:
          type: string
        Description:
          type: string
    IApiResult:
      type: object
      properties: {}
    ApiResponse:
      type: object
      properties:
        Results:
          type: array
          items:
            $ref: '#/components/schemas/IApiResult'
        Total:
          format: int32
          type: integer
    BillingInfoViewModel:
      type: object
      properties:
        BillToCompany:
          $ref: '#/components/schemas/CompanyDetailsViewModel'
        BillingTerms:
          type: string
        BillingTermsDesc:
