        RequesterEmail:
          type: string
        Subtotal:
          format: double
          type: number
        FreightCharge:
          format: double
          type: number
        TaxAmount:
          format: double
          type: number
        Total:
          format: double
          type: number
        IsOpen:
          type: boolean
        IsApproved:
          type: boolean
        IsPartsOrdered:
          type: boolean
        UDFBit1:
          type: boolean
        UDFBit2:
          type: boolean
        UDFBit3:
          type: boolean
        UDFBit4:
          type: boolean
        UDFBit5:
          type: boolean
        LastModifiedDate:
