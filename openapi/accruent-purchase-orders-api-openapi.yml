        ShipToCompany:
          $ref: '#/components/schemas/CompanyDetailsViewModel'
        FreightTerms:
          type: string
        FreightTermsDesc:
          type: string
        ShippingMethod:
          type: string
        ShippingMethodDesc:
          type: string
        TrackingNo:
          type: string
    CompanyDetailsViewModel:
      type: object
