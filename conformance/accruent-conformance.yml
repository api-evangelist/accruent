domain_standards:
- id: odata-query-options
  name: OData query options (subset)
  conforms: partial
  evidence: >-
    The Maintenance Connection Web API implements OData 4.0 query options natively as its filtering,
    paging and sorting contract - $filter, $top, $skip and $orderby - with the logical operators
    eq, ne, gt, ge, lt, le, and, or, not and precedence grouping, and dotted traversal into nested
    Ref elements (RepairCenterRef.ID). Accruent states the scope plainly: "Currently OData support
    is limited to the following keywords."
  spec_location: https://api.maintenanceconnection.com/v8/help/docs/RequestDocs
  gaps:
  - No $metadata document, so the service is not OData-discoverable.
  - No $select, $expand, $count or the string functions (contains/startswith/endswith).
  - No OData-Version header or OData JSON payload format; responses use the ApiResponse envelope.
  buyer_impact: >-
    A consumer who already speaks OData can point an existing query builder at the filter, sort and
    paging surface without a bespoke connector, but cannot rely on $metadata for discovery or on
    OData response shapes for deserialisation.
  method: searched
- id: cmms-eam-domain-standards
  name: CMMS / EAM interchange standards (MIMOSA CCOM, ISO 14224, OAGIS)
  conforms: false
  evidence: >-
    No CMMS or EAM interchange standard is declared in the contract or the docs. The data model is
    Maintenance Connection's own (WorkOrderViewModel, AssetViewModel, PartViewModel), not a
    MIMOSA CCOM, ISO 14224 or OAGIS shape. Recorded as a measured absence, not a penalty - this
    market has no standard the vendor has adopted.
  method: searched
