  note: No preview, validate-only or dry-run mode is documented for any write operation.
reversibility:
  status: none
  grade: null
  note: >-
    The Maintenance Connection Web API has a substantial write surface - 131 of 255 operations are
    POST or PUT - and publishes NO reversal path for any of it. There is no DELETE operation on any
    of the 126 paths, and no cancel, void, reverse, undo or restore operation exists under any
    other verb. The docs describe a 204 No Content response for "successful deletion of a
    resource", but no operation in the contract can produce it. Nor is there a status-transition
    escape hatch: the two status surfaces the API exposes -
    WorkOrderStatusUpdates_GetStatusUpdatesForWorkOrder and
    PurchaseOrderStatusUpdates_GetStatusUpdatesForPurchaseOrder - are GET-only, so an agent can
    read a record's status history but cannot write a cancelling or closing transition through
    them. Accruent publishes no statement about which transitions are permitted or reversible, and
    no window inside which any correction is possible. An agent that creates a work order, a
    purchase order, an invoice or a part transaction through this API cannot take it back through
    this API.
  reversal_operations: []
  window: null
