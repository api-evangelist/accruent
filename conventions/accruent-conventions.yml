scope: >-
  These conventions describe the Maintenance Connection Web API, the only Accruent surface whose
  request/response semantics are published without a login. Siterra, Meridian Cloud, EMS Platform
  Services and Lucernex document their conventions only inside gated portals or customer tenancies.
authentication:
  style: http-basic
  header: Authorization
  value: Basic base64("ConnectionKey:APIKey")
  transport: HTTPS required - a non-SSL request returns 401
  docs: https://api.maintenanceconnection.com/v8/help/docs/AuthenticationDocs
  see: authentication/accruent-authentication.yml
idempotency:
  supported: false
  coverage: none
  header: null
  scope: []
  retention: null
  note: >-
    No idempotency key, request-id dedupe, or replay-protection mechanism of any kind is documented
    or present in the contract. PUT updates are idempotent by HTTP semantics, but POST creates are
    not: the only guard against a duplicate create is the 409 Conflict returned when an ID is not
    unique, and that only fires for records whose ID the client supplies. A retried POST after a
    timeout can create a second work order. No Idempotency pointer is emitted for this provider.
pagination:
  style: odata-offset
  params:
    limit: $top
    offset: $skip
    sort: $orderby
    filter: $filter
  default_page_size: 50
  max_page_size: 500
  response_fields: []
  cursor: false
  total_count_field: null
  note: >-
    OData-style query options over an offset window. There is no cursor, no next-page link and no
    total-count field in the response, so a client paging a large result set must track $skip
    itself and cannot detect concurrent inserts shifting the window.
  docs: https://api.maintenanceconnection.com/v8/help/docs/RequestDocs
filtering:
  style: odata-$filter
  operators_supported: [eq, ne, gt, ge, lt, le, and, or, not, '( )']
  operators_absent: [contains, startswith, endswith, any, all, $select, $expand, $count]
  traversal: >-
    $filter can reference nested elements in the response, including "Ref" type elements such as
    RepairCenterRef.ID.
  note: >-
    A deliberate subset of OData 4.0 query options - Accruent's own words are "Currently OData
    support is limited to the following keywords". See conformance/accruent-conformance.yml.
  docs: https://api.maintenanceconnection.com/v8/help/docs/RequestDocs
batching:
  supported: true
  methods: [POST, PUT]
  max_records_per_batch: 200
  note: Creating or updating multiple resources in one request, capped at 200 records per batch.
  docs: https://api.maintenanceconnection.com/v8/help/docs/RequestDocs
field_expansion:
  supported: false
  note: No $expand or sparse-fieldset support; related entities appear as EntityRefViewModel stubs.
metadata:
  custom_fields: false
  note: No customer-defined metadata bag on resources in the published contract.
request_tracing:
  request_id_header: null
  correlation_id: null
  note: No request-id or correlation-id header is documented or returned.
versioning:
