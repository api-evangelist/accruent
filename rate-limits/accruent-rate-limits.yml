note: >-
  Accruent publishes exactly one numeric rate limit anywhere in its public API surface, and it is
  buried in the Maintenance Connection response-code table rather than in a rate-limit page. The
  API returns 403 Forbidden - not 429 - on exhaustion, and ships no rate-limit response headers at
  all, so an agent cannot see how much budget is left or when it resets; it can only observe the
  403 after the fact and cannot distinguish it from an authorisation failure without reading the
  body. Siterra, Meridian Cloud, EMS Platform Services and Lucernex publish no limits.
rate_limits:
- api: Maintenance Connection Web API
  scope: per-connection
  window: 1m
  limit: 200
  unit: requests
  burst: null
  status_on_exhaustion: 403
  status_note: >-
    "403 Forbidden - Exceeded Connections Limit: Only 200 requests per minute are allowed."
    Verbatim from the published Response and Error Codes table.
